name: Feature Request
description: Suggest an improvement or new feature for Lost in Translation
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the app would this affect?
      options:
        - Core Engine (translation logic, spell correction)
        - GUI (CustomTkinter interface)
        - CLI (command-line interface)
        - Dependencies / Build
        - Documentation
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem / Motivation
      description: What problem does this solve, or what need does it address?
      placeholder: "I find it frustrating when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you'd like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you thought of? (optional)
    validations:
      required: false

  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
